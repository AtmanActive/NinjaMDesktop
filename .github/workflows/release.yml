name: release

# Run manually from the Actions tab ("Run workflow"). Builds all packages and
# creates (or updates) a DRAFT release named v<version>, ready to edit and publish.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.2.0 (empty: use NJD_VERSION from CMakeLists.txt)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          v="${INPUT_VERSION#v}"
          if [ -z "$v" ]; then
            v=$(sed -n 's/^set(NJD_VERSION "\([^"]*\)".*/\1/p' CMakeLists.txt)
          fi
          if ! echo "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version must look like 1.2.3 (got '$v')"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # the oldest supported Ubuntu keeps the glibc requirement of the AppImage and .deb low
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ perl pkg-config dpkg-dev file \
            libgtk-3-dev libfreetype-dev libfontconfig-dev libgl-dev libx11-dev libxi-dev \
            libvorbis-dev libogg-dev

      - name: Build
        run: |
          # packages use Exec=NinjaMDesktop in the .desktop file (AppImage requires it)
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNJD_VERSION="$VERSION" -DNJD_DESKTOP_EXEC_ABSOLUTE=OFF
          cmake --build build -j"$(nproc)"
          mkdir -p dist

      - name: Package .deb
        run: |
          (cd build && cpack -G DEB)
          mv build/ninjamdesktop_*.deb dist/
          dpkg-deb -I dist/ninjamdesktop_*.deb

      - name: Package .tar.gz
        run: |
          name="NinjaMDesktop-$VERSION-linux-x86_64"
          cmake --install build --prefix "stage/$name"
          cp LICENSE README.md "stage/$name/"
          tar -C stage -czf "dist/$name.tar.gz" "$name"

      - name: Package AppImage
        run: |
          curl -sSfL -o linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-gtk.sh \
            https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          DESTDIR="$PWD/AppDir" cmake --install build --prefix /usr
          export APPIMAGE_EXTRACT_AND_RUN=1 DEPLOY_GTK_VERSION=3 LINUXDEPLOY_OUTPUT_VERSION="$VERSION"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin gtk --output appimage \
            -d AppDir/usr/share/applications/ninjamdesktop.desktop \
            -i AppDir/usr/share/icons/hicolor/256x256/apps/ninjamdesktop.png
          mv "NinjaMDesktop-$VERSION-x86_64.AppImage" dist/

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build
        run: |
          cmake -B build -A x64 -DNJD_VERSION="$env:VERSION"
          cmake --build build --config Release

      - name: Package .zip
        run: |
          $name = "NinjaMDesktop-$env:VERSION-windows-x64"
          New-Item -ItemType Directory -Force -Path "stage/$name", "dist" | Out-Null
          Copy-Item build/Release/NinjaMDesktop.exe, LICENSE, README.md -Destination "stage/$name/"
          Compress-Archive -Path "stage/$name" -DestinationPath "dist/$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: version
    runs-on: macos-14
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Build (universal binary for Apple silicon and Intel)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DNJD_VERSION="$VERSION" \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.13
          cmake --build build -j"$(sysctl -n hw.ncpu)"
          # not notarized: ad-hoc sign the whole bundle so it runs on Apple silicon
          codesign --force --deep --sign - build/NinjaMDesktop.app

      - name: Package .dmg
        run: |
          mkdir -p stage dist
          cp -R build/NinjaMDesktop.app stage/
          ln -s /Applications stage/Applications
          cp LICENSE stage/LICENSE.txt
          hdiutil create -volname "NinjaMDesktop $VERSION" -srcfolder stage -ov -format UDZO \
            "dist/NinjaMDesktop-$VERSION-macos.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  release:
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Source archive
        # the GPL requires offering the complete source with the binaries; GitHub's
        # automatic source archives leave out the submodules (NINJAM, miniaudio)
        run: |
          name="NinjaMDesktop-$VERSION-source"
          mkdir -p dist
          git ls-files --recurse-submodules | tar --transform "s,^,$name/," -czf "dist/$name.tar.gz" -T -

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        run: |
          tag="v$VERSION"
          ls -la dist
          cat > notes.md <<EOF
          NinjaMDesktop $VERSION

          ## Downloads

          | System | File |
          |---|---|
          | Debian, Ubuntu and derivatives | \`ninjamdesktop_${VERSION}_amd64.deb\` (install with \`sudo apt install ./ninjamdesktop_${VERSION}_amd64.deb\`) |
          | Any Linux (x86-64) | \`NinjaMDesktop-$VERSION-x86_64.AppImage\` (make it executable, then run it) |
          | Linux, manual install | \`NinjaMDesktop-$VERSION-linux-x86_64.tar.gz\` (needs GTK 3, libvorbis and libogg from your distribution) |
          | Windows 10/11 (x64) | \`NinjaMDesktop-$VERSION-windows-x64.zip\` (unzip and run \`NinjaMDesktop.exe\`) |
          | macOS 11+ (Apple silicon and Intel) | \`NinjaMDesktop-$VERSION-macos.dmg\` |
          | Source code, including the NINJAM and miniaudio submodules | \`NinjaMDesktop-$VERSION-source.tar.gz\` |

          The Windows and macOS builds are not code-signed. Windows SmartScreen may ask for confirmation
          (More info > Run anyway). On macOS, right-click the app and choose Open the first time, or run
          \`xattr -dr com.apple.quarantine /Applications/NinjaMDesktop.app\`.
          EOF

          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft -q .isDraft)" != "true" ]; then
              echo "::error::Release $tag is already published; choose a new version."
              exit 1
            fi
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" \
              --title "NinjaMDesktop $VERSION" --notes-file notes.md
          fi
