name: build

# Test build on Linux, Windows and macOS. Run manually from the Actions tab ("Run workflow").
on:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkgconf libgtk-3-dev libfreetype-dev libfontconfig-dev \
            libgl-dev libx11-dev libxi-dev libvorbis-dev libogg-dev
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
      - uses: actions/upload-artifact@v7
        with:
          name: NinjaMDesktop-linux-x86_64
          path: build/NinjaMDesktop

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -A x64
          cmake --build build --config Release
      - uses: actions/upload-artifact@v7
        with:
          name: NinjaMDesktop-windows-x64
          path: build/Release/NinjaMDesktop.exe

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build -j
      - name: Package
        run: ditto -c -k --keepParent build/NinjaMDesktop.app NinjaMDesktop-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: NinjaMDesktop-macos
          path: NinjaMDesktop-macos.zip
